<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>InvestCalc — compound interest &amp; investment planner</title>
    <meta
      name="description"
      content="Plan long-term investing with an accurate compound interest calculator: changing contributions over time, goals, inflation, fees, withdrawals, scenario comparison and Monte Carlo. Czech &amp; English. Runs entirely in your browser."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050b18" />
    <link rel="canonical" href="https://investcalc.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InvestCalc" />
    <meta property="og:title" content="InvestCalc — compound interest & investment planner" />
    <meta property="og:description" content="Accurate compound interest projections with changing contributions, goals, inflation, fees and withdrawals." />
    <meta property="og:url" content="https://investcalc.dev/" />
    <meta property="og:image" content="https://investcalc.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var th = localStorage.getItem('investcalc.theme')
        if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th)
        var lg = new URLSearchParams(location.search).get('lang') || localStorage.getItem('investcalc.lang')
        if (lg === 'cs' || lg === 'en') document.documentElement.lang = lg
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>InvestCalc needs JavaScript to run the calculator. / InvestCalc potřebuje ke spuštění JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
